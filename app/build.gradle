plugins { id 'com.android.application' }

android {
    namespace 'dev.cpuguard'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.cpuguard'
        minSdk 26
        targetSdk 28 // Legacy target for compatibility; not a guarantee on ColorOS 16.
        versionCode 4
        versionName '1.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Compile only: LSPosed supplies the actual runtime framework classes.
    compileOnly 'de.robv.android.xposed:api:82'
}
